[pytest]
base_url = https://backpack.exchange
testpaths = tests
pythonpath = .
# On a failed test: keep a trace and a screenshot in test-results/
addopts = --tracing retain-on-failure --screenshot only-on-failure
markers =
    smoke: P1 checks, the most important user paths
    regression: P2 checks, secondary user paths (not run in CI)
filterwarnings =
    ignore:.*fixtures defined as instance methods:pytest.PytestRemovedIn10Warning